# The faucet is maintained in https://github.com/0xMiden/faucet and can lag
# behind the node's protocol version. Keep it optional and pin the exact source
# used for local builds and node release images.
services:
  faucet:
    profiles: [faucet]
    image: ${MIDEN_FAUCET_IMAGE:-ghcr.io/0xmiden/miden-faucet:v0.16.0-rc.3}
    pull_policy: missing
    build:
      context: https://github.com/0xMiden/faucet.git#b9800b4fb0571d1f2469ac58e40c529e23880188
    volumes:
      - faucet-data:/faucet
      - node-data:/data:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        if [ ! -f /faucet/.initialized ]; then
          echo "Initializing faucet..."
          rm -f \
            /faucet/store.sqlite \
            /faucet/store.sqlite-shm \
            /faucet/store.sqlite-wal
          /usr/local/bin/entrypoint.sh init
          touch /faucet/.initialized
        fi

        exec /usr/local/bin/entrypoint.sh start
    environment:
      MIDEN_FAUCET_API_PUBLIC_URL: http://faucet.localhost/api
      MIDEN_FAUCET_ENABLE_OTEL: "true"
      MIDEN_FAUCET_IMPORT_OPERATOR_ACCOUNT_PATH: /data/accounts/faucet_operator.mac
      MIDEN_FAUCET_NETWORK: localhost
      MIDEN_FAUCET_NODE_URL: http://rpc.localhost
      MIDEN_FAUCET_REMOTE_TX_PROVER_URL: http://tx-prover:50051
      MIDEN_FAUCET_STORE: /faucet/store.sqlite
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=faucet
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8081:8080"
    depends_on:
      otel-collector:
        condition: service_started
      sequencer:
        condition: service_started
      tx-prover:
        condition: service_started
    restart: unless-stopped

volumes:
  faucet-data:
