// Specification of the user facing gRPC API.
syntax = "proto3";
package validator;

import "types/transaction.proto";
import "types/blockchain.proto";
import "types/block_header.proto";
import "types/partial_blockchain.proto";
import "types/account.proto";
import "types/note.proto";
import "types/primitives.proto";
import "google/protobuf/empty.proto";

// VALIDATOR API
// ================================================================================================

// Validator API for the Validator component.
service Api {
   // Returns the status info of the validator.
   rpc Status(google.protobuf.Empty) returns (ValidatorStatus) {}

   // Submits a transaction to the validator.
   rpc SubmitProvenTransaction(transaction.ProvenTransaction) returns (google.protobuf.Empty) {}

   // Validates and signs a proposed block, returning the signature and the signed block commitment.
   rpc SignBlock(ProposedBlock) returns (blockchain.SignBlockResponse) {}

   // Streams signed blocks starting from the given block number (inclusive).
   //
   // Replays backed-up blocks first, then streams live blocks as they are signed. Unlike the RPC
   // block subscription, the blocks streamed here carry no proofs; they must be commissioned
   // separately as part of recovery.
   rpc BlockSubscription(BlockSubscriptionRequest) returns (stream BlockSubscriptionResponse) {}

   // Returns the public key that clients use to encrypt the private inputs of the transactions
   // they submit, attested by this validator's own signing key.
   //
   // The encryption key is shared across the whole validator set, so the returned public key is
   // identical regardless of which validator serves the request. The attestation carried in the
   // response is specific to this validator.
   rpc GetTransactionEncryptionKey(google.protobuf.Empty) returns (transaction.TransactionEncryptionKey) {}
}

// PROPOSED BLOCK
// ================================================================================================

// The inputs from which every validator independently reconstructs and validates a proposed block.
message ProposedBlock {
    reserved 1;
    reserved "proposed_block";

    BlockInputs block_inputs = 2;
    repeated transaction.ProvenBatch batches = 3;
    fixed32 timestamp = 4;
    repeated blockchain.ValidatorPublicKey next_validator_keys = 5;
}

// State witnesses required to construct a proposed block.
message BlockInputs {
    blockchain.BlockHeader prev_block_header = 1;
    blockchain.PartialBlockchain partial_blockchain = 2;

    // Canonically ordered by requested account ID.
    repeated account.AccountWitness account_witnesses = 3;

    // Canonically ordered by nullifier.
    repeated NullifierWitness nullifier_witnesses = 4;

    // Canonically ordered by note ID.
    repeated note.NoteInclusionInBlockProof unauthenticated_note_proofs = 5;
}

message NullifierWitness {
    primitives.Word nullifier = 1;
    primitives.SmtOpening proof = 2;
}

// BLOCK SUBSCRIPTION
// ================================================================================================

// Request to subscribe to the signed block stream.
message BlockSubscriptionRequest {
    // The block number to start streaming from (inclusive).
    fixed32 block_from = 1;
}

// A signed block streamed to a subscriber.
message BlockSubscriptionResponse {
    reserved 1;
    reserved "block";

    // The signed chain tip when this item was emitted.
    fixed32 committed_chain_tip = 2;

    // The signed block.
    blockchain.SignedBlock signed_block = 3;
}

// VALIDATOR STATUS
// ================================================================================================

// Represents the status of the validator.
message ValidatorStatus {
    // The validator's running version.
    string version = 1;

    // The validator's status.
    string status = 2;

    // The validator's current chain tip (highest signed block number).
    fixed32 chain_tip = 3;

    // The total number of transactions validated by this validator.
    fixed64 validated_transactions_count = 4;

    // The total number of blocks signed by this validator.
    fixed64 signed_blocks_count = 5;
}
