timestamp = 1717344256
version   = 1

# The native MIDEN faucet is always generated as a network account, owned by a generated operator
# account that holds the only key permitted to mint. Both are written to the accounts directory as
# `native_faucet.mac` and `faucet_operator.mac`. Wallet balances below are funded directly in the
# genesis state and do not require minting.

# Required: hex-encoded public keys of the genesis validator set (see `miden-validator pubkey`),
# committed to by the genesis header. The genesis block itself is not signed; these keys must sign
# every block after genesis. A configuration file must list its validators explicitly — only the
# built-in development configuration (used when no config file is supplied) falls back to the
# predefined, insecure development key.
# validators = ["<validator-1-public-key-hex>", "<validator-2-public-key-hex>"]

[fee_parameters]
verification_base_fee = 0

[[fungible_faucet]]
account_type = "public"
decimals     = 3
max_supply   = 100_000_000
symbol       = "WHAT"

[[wallet]]
account_type = "private"
assets       = [{ amount = 999_000, symbol = "MIDEN" }]

[[wallet]]
account_type = "private"
assets       = [{ amount = 777, symbol = "MIDEN" }]

[[wallet]]
account_type = "private"
assets       = [{ amount = 1, symbol = "WHAT" }]
