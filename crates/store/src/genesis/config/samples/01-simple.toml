timestamp = 1717344256
version   = 1

# Hex-encoded public keys of the genesis validator set (see `miden-validator pubkey`), committed
# to by the genesis header. The genesis block itself is not signed; these keys must sign every
# block after genesis. When omitted, the set defaults to the public key of the predefined,
# insecure development signing key — list the validators explicitly for anything but local
# development.
# validators = ["<validator-1-public-key-hex>", "<validator-2-public-key-hex>"]

[fee_parameters]
verification_base_fee = 0

[[fungible_faucet]]
account_type = "public"
decimals     = 3
max_supply   = 100_000_000
symbol       = "WHAT"

[[wallet]]
account_type = "private"
assets       = [{ amount = 999_000, symbol = "MIDEN" }]

[[wallet]]
account_type = "private"
assets       = [{ amount = 777, symbol = "MIDEN" }]

[[wallet]]
account_type = "private"
assets       = [{ amount = 1, symbol = "WHAT" }]
