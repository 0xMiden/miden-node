syntax = "proto3";
package blockchain;

import "types/account.proto";
import "types/block_header.proto";
import "types/primitives.proto";
import "types/transaction.proto";

// BLOCK
// ================================================================================================

// Represents a signed block.
message SignedBlock {
    BlockHeader header = 1;
    BlockBody body = 2;
    // The validators' positional signatures over the block header, one per key in the parent's
    // validator set.
    repeated BlockSignature signatures = 3;
}

// Request for retrieving a block by its number, optionally including the block proof.
message BlockRequest {
    // The block number of the target block.
    fixed32 block_num = 1;
    // Whether to include the block proof in the response.
    optional bool include_proof = 2;
}

// Response containing the block data and optionally its proof.
//
// Contains empty values for both blocks and proofs that are not found. Some blocks may not yet be
// proven so it is possible to retrieve a block without a proof even if the proof has been requested.
message MaybeBlock {
    reserved 1, 2;
    reserved "block", "proof";

    optional SignedBlock signed_block = 3;
    optional BlockProof block_proof = 4;
}

// Represents a block number.
message BlockNumber {
    // The block number of the target block.
    fixed32 block_num = 1;
}

// Represents a block number or nothing.
message MaybeBlockNumber {
    // The block number of the target block.
    optional fixed32 block_num = 1;
}

// BLOCK SIGNATURE
// ================================================================================================

// Block ECDSA Signature.
message BlockSignature {
    // Signature encoded using [miden_serde_utils::Serializable] implementation for
    // [crypto::dsa::ecdsa_k256_keccak::Signature].
    bytes signature = 1;
}

// Response to a `SignBlock` request: the block signature together with the commitment of the block
// header that the validator actually signed, so the block producer can detect a block-hash mismatch.
message SignBlockResponse {
    // The validator's signature over the block.
    BlockSignature signature = 1;
    // Commitment of the block header that the validator signed.
    primitives.Digest block_commitment = 2;
    // The validator's public key, identifying this validator.
    ValidatorPublicKey public_key = 3;
}


// BLOCK BODY
// ================================================================================================

// Represents a block body.
message BlockBody {
    reserved 1;
    reserved "block_body";

    BlockBodyContents contents = 2;
}

message BlockAccountUpdate {
    account.AccountId account_id = 1;
    primitives.Word final_state_commitment = 2;
    account.AccountUpdateDetails details = 3;
}

message IndexedOutputNote {
    uint32 note_index_in_batch = 1;
    transaction.OutputNote note = 2;
}

message OutputNoteBatch {
    repeated IndexedOutputNote notes = 1;
}

message BlockBodyContents {
    repeated BlockAccountUpdate updated_accounts = 1;
    repeated OutputNoteBatch output_note_batches = 2;
    repeated primitives.Word created_nullifiers = 3;
    repeated transaction.TransactionHeader transactions = 4;
}

// Placeholder block proof. Extend this message when the protocol proof gains fields.
message BlockProof {}
