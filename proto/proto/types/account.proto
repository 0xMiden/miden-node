syntax = "proto3";
package account;

import "types/primitives.proto";

// ACCOUNT
// ================================================================================================

// Uniquely identifies a specific account.
//
// A Miden account ID is a 120-bit value derived from the commitments to account code and storage,
// and a random user-provided seed.
message AccountId {
    // 15 bytes (120 bits) encoded using [miden_serde_utils::Serializable] implementation for
    // [miden_protocol::account::account_id::AccountId].
    bytes id = 1;
}

// A list of account IDs.
message AccountIdList {
    // The list of account IDs.
    repeated AccountId account_ids = 1;
}

// The state of an account at a specific block height.
message AccountSummary {
    // The account ID.
    AccountId account_id = 1;

    // The current account commitment or zero if the account does not exist.
    primitives.Digest account_commitment = 2;

    // Block number at which the summary was made.
    uint32 block_num = 3;
}

// Represents the storage header of an account.
message AccountStorageHeader {
    // A single storage slot in the account storage header.
    message StorageSlot {
        // The name of the storage slot.
        string slot_name = 1;

        // The type of the storage slot.
        uint32 slot_type = 2;

        // The data (Word) for this storage slot.
        // For value slots (slot_type=0), this is the actual value stored in the slot.
        // For map slots (slot_type=1), this is the root of the storage map.
        primitives.Digest commitment = 3;
    }

    // Storage slots with their types and data.
    repeated StorageSlot slots = 1;
}

// An account details.
message AccountDetails {
    // Account summary.
    AccountSummary summary = 1;

    // Account details encoded using [miden_serde_utils::Serializable] implementation for
    // [miden_protocol::account::Account].
    optional bytes details = 2;
}

// An account header.
message AccountHeader {
    // The account ID.
    AccountId account_id = 1;

    // Vault root hash.
    primitives.Digest vault_root = 2;

    // Storage root hash.
    primitives.Digest storage_commitment = 3;

    // Code root hash.
    primitives.Digest code_commitment = 4;

    // Account nonce.
    uint64 nonce = 5;
}

// An account witness.
message AccountWitness {
    // Account ID for which this proof is requested.
    account.AccountId account_id = 1;

    // The account ID within the proof, which may be different from the above account ID.
    // This can happen when the requested account ID's prefix matches the prefix of an existing
    // account ID in the tree. Then the witness will prove inclusion of this witness ID in the tree.
    account.AccountId witness_id = 2;

    // The state commitment whose inclusion the witness proves.
    primitives.Digest commitment = 3;

    // The merkle path of the state commitment in the account tree.
    primitives.SparseMerklePath path = 4;
}

// ACCOUNT PATCH
// ================================================================================================

// Public interface and implementation of an account.
message AccountCode {
    // Deliberately opaque MastForest encoded with Miden serialization.
    bytes mast = 1;

    // Ordered public interface procedures.
    repeated primitives.Word procedure_roots = 2;
}

enum StoragePatchOperation {
    STORAGE_PATCH_OPERATION_UNSPECIFIED = 0;
    STORAGE_PATCH_OPERATION_CREATE = 1;
    STORAGE_PATCH_OPERATION_UPDATE = 2;
    STORAGE_PATCH_OPERATION_REMOVE = 3;
}

message StorageValuePatch {
    StoragePatchOperation operation = 1;

    // Required for CREATE/UPDATE and forbidden for REMOVE.
    primitives.Word value = 2;
}

message StorageMapEntry {
    primitives.Word key = 1;
    primitives.Word value = 2;
}

message StorageMapPatch {
    StoragePatchOperation operation = 1;

    // CREATE may be empty; UPDATE must be non-empty; REMOVE must be empty.
    repeated StorageMapEntry entries = 2;
}

message StorageSlotPatch {
    string slot_name = 1;

    oneof patch {
        StorageValuePatch value = 2;
        StorageMapPatch map = 3;
    }
}

message AccountStoragePatch {
    repeated StorageSlotPatch slots = 1;
}

message AccountVaultPatchEntry {
    primitives.Word asset_id = 1;

    // Word::empty means removal; any other value must form a valid asset with asset_id.
    primitives.Word value = 2;
}

message AccountVaultPatch {
    repeated AccountVaultPatchEntry entries = 1;
}

message AccountPatch {
    AccountId account_id = 1;
    AccountStoragePatch storage = 2;
    AccountVaultPatch vault = 3;
    optional AccountCode code = 4;
    optional primitives.Felt final_nonce = 5;
}

message PrivateAccountUpdate {}

message AccountUpdateDetails {
    oneof update {
        PrivateAccountUpdate private = 1;
        AccountPatch public = 2;
    }
}
