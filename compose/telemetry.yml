services:
  tempo:
    profiles: [telemetry]
    image: grafana/tempo:2.10.4
    configs:
      - source: tempo
        target: /etc/tempo.yaml
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"

  grafana:
    profiles: [telemetry]
    image: grafana/grafana:12.4
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
      - source: grafana-dashboards
        target: /etc/grafana/provisioning/dashboards/dashboards.yaml
      - source: grafana-miden-node-dashboard
        target: /var/lib/grafana/dashboards/miden-node.json
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/miden-node.json
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - tempo

configs:
  tempo:
    content: |
      stream_over_http_enabled: true

      server:
        http_listen_port: 3200

      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: "0.0.0.0:4317"

      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
          wal:
            path: /var/tempo/wal

      metrics_generator:
        registry:
          external_labels:
            source: tempo
        storage:
          path: /var/tempo/metrics/wal
        traces_storage:
          path: /var/tempo/metrics/traces

      overrides:
        metrics_generator_processors: [service-graphs, span-metrics, local-blocks] # enables metrics generator

  grafana-datasources:
    content: |
      apiVersion: 1

      datasources:
        - name: Tempo
          type: tempo
          access: proxy
          url: http://tempo:3200
          isDefault: true
          version: 1
          editable: false
          uid: tempo

  grafana-dashboards:
    content: |
      apiVersion: 1

      providers:
        - name: default
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards
            foldersFromFilesStructure: false

  grafana-miden-node-dashboard:
    content: |
      {
        "annotations": {
          "list": []
        },
        "editable": true,
        "fiscalYearStartMonth": 0,
        "graphTooltip": 0,
        "links": [],
        "panels": [
          {
            "datasource": {
              "type": "tempo",
              "uid": "tempo"
            },
            "fieldConfig": {
              "defaults": {},
              "overrides": []
            },
            "gridPos": {
              "h": 10,
              "w": 24,
              "x": 0,
              "y": 0
            },
            "id": 1,
            "targets": [
              {
                "datasource": {
                  "type": "tempo",
                  "uid": "tempo"
                },
                "queryType": "traceqlSearch",
                "limit": 20,
                "tableType": "traces",
                "filters": [
                  {
                    "id": "service-name",
                    "tag": "service.name",
                    "operator": "=",
                    "scope": "resource"
                  }
                ]
              }
            ],
            "title": "Recent Traces",
            "type": "table"
          },
          {
            "datasource": {
              "type": "tempo",
              "uid": "tempo"
            },
            "fieldConfig": {
              "defaults": {},
              "overrides": []
            },
            "gridPos": {
              "h": 10,
              "w": 24,
              "x": 0,
              "y": 10
            },
            "id": 2,
            "targets": [
              {
                "datasource": {
                  "type": "tempo",
                  "uid": "tempo"
                },
                "queryType": "traceql",
                "query": "{name =~ \"block_builder.*\"}",
                "limit": 20,
                "tableType": "traces"
              }
            ],
            "title": "Block Building Traces",
            "type": "table"
          },
          {
            "datasource": {
              "type": "tempo",
              "uid": "tempo"
            },
            "fieldConfig": {
              "defaults": {},
              "overrides": []
            },
            "gridPos": {
              "h": 10,
              "w": 24,
              "x": 0,
              "y": 20
            },
            "id": 3,
            "targets": [
              {
                "datasource": {
                  "type": "tempo",
                  "uid": "tempo"
                },
                "queryType": "traceql",
                "query": "{name =~ \"batch_builder.*\"}",
                "limit": 20,
                "tableType": "traces"
              }
            ],
            "title": "Batch Building Traces",
            "type": "table"
          }
        ],
        "schemaVersion": 39,
        "tags": ["miden"],
        "templating": {
          "list": []
        },
        "time": {
          "from": "now-30m",
          "to": "now"
        },
        "title": "Miden Node",
        "uid": "miden-node",
        "version": 2
      }
