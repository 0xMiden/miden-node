syntax = "proto3";
package transaction;

import "types/account.proto";
import "types/note.proto";
import "types/primitives.proto";

// TRANSACTION
// ================================================================================================

// A proven transaction.
//
// Note that we currently require full transaction transparency for the validator set. This is a
// temporary measure while Miden stabilizes its protocol and proof systems. To this end, a
// transaction submission includes its **private** inputs, which a validator uses to verify that
// the transaction execution and proofs are correct.
//
// Those inputs are sealed against the validator set's shared transaction encryption key, so the
// nodes that relay a submission cannot read them: only a validator can. Submissions carrying
// unsealed inputs are rejected. This requirement will be lifted as Miden matures.
message ProvenTransaction {
  // The transaction proof.
  //
  // Encoded using [miden_protocol::transaction::ProvenTransaction::to_bytes].
  bytes transaction = 1;

  // The sealed private inputs used for the transaction proof.
  //
  // Transactions missing this field will be rejected as per the message description.
  SealedTransactionInputs sealed_transaction_inputs = 2;
}

// Transaction inputs sealed against the validator set's shared transaction encryption key.
//
// Obtain the key with `GetTransactionEncryptionKey` before submitting.
message SealedTransactionInputs {
  // Opaque identifier of the encryption key the inputs were sealed against, copied from
  // [TransactionEncryptionKey.key_id].
  bytes key_id = 1;

  // The transaction inputs sealed with [miden_protocol::crypto::ies::SealingKey], encoded using
  // the [miden_protocol::crypto::utils::Serializable] implementation for
  // [miden_protocol::crypto::ies::SealedMessage].
  bytes ciphertext = 2;
}

// A proven batch of transactions.
//
// Note that we currently require full transaction transparency for the validator set. This is a
// temporary measure while Miden stabilizes its protocol and proof systems. To this end, each
// transaction includes its **private** inputs, which a validator uses to verify that the
// transaction execution and proofs are correct.
//
// Those inputs are sealed against the validator set's shared transaction encryption key, so the
// nodes that relay a submission cannot read them: only a validator can. Batches carrying unsealed
// inputs are rejected. This requirement will be lifted as Miden matures.
//
// In addition, in order to verify the batch itself, we also require the proposed batch.
message TransactionBatch {
  // The batch proof.
  //
  // Encoded using [miden_protocol::batch::ProvenBatch::to_bytes].
  bytes batch_proof = 1;
  // The batch contents of the given proof.
  //
  // Encoded using [miden_protocol::batch::ProposedBatch::to_bytes].
  //
  // Batches missing this field will be rejected as per the message description.
  optional bytes proposed_batch = 2;

  // The sealed transaction inputs for each transaction in the batch.
  //
  // Must match the transaction ordering in the batch. Each entry is sealed independently against
  // its own transaction's id, because the batch is fanned out into one validator submission per
  // transaction.
  //
  // Batch will be rejected if any transaction's input is missing as per the method description.
  repeated SealedTransactionInputs sealed_transaction_inputs = 3;
}

// IES scheme used for transaction input encryption.
//
// Non-zero values match the discriminants of [miden_protocol::crypto::ies::IesScheme]. New
// schemes are added here as the node starts supporting them.
enum IesScheme {
  IES_SCHEME_UNSPECIFIED = 0;
  IES_SCHEME_X25519_XCHACHA20_POLY1305 = 1;
}

// A single validator's attestation of a complete transaction encryption key schedule.
message ValidatorKeyAttestation {
  // Public key of the attesting validator, encoded using the [miden_serde_utils::Serializable]
  // implementation for [miden_protocol::crypto::dsa::ecdsa_k256_keccak::PublicKey]. Must match a
  // validator signing key committed in block headers to be trusted.
  bytes validator_public_key = 1;

  // The validator's signature over the attestation commitment: the Poseidon2 byte-mode hash of
  // `domain_tag || genesis_commitment || attestation_epoch || current_activation || current_key ||
  // next_key_present || next_key_transcript`, where `domain_tag` is the ASCII string
  // `MIDEN_TX_ENCRYPTION_KEY_SCHEDULE_ATTESTATION_V2` and the genesis block commitment ties the
  // attestation to one network.
  //
  // Each key contributes `scheme || len(key_id) || key_id || len(public_key) || public_key`, with
  // the scheme, the epoch, the block numbers and the length prefixes encoded as 4 bytes
  // little-endian. `next_key_present` is a single byte, followed by the scheduled key's
  // `activation_block_num || key` when it is set, so a scheduled rotation can neither be stripped
  // nor injected without invalidating the signature. The canonical construction and verifier live
  // in `miden_node_proto::domain::encryption`.
  bytes signature = 2;
}

// One shared transaction encryption key.
//
// The public key is shared across the whole validator set. Attestations are not carried here but
// on `TransactionEncryptionKeyResponse`, because a validator signs the complete schedule rather
// than any single key.
message TransactionEncryptionKey {
  // IES scheme the encryption key belongs to.
  //
  // Currently always `IES_SCHEME_X25519_XCHACHA20_POLY1305`.
  IesScheme scheme = 1;

  // Opaque identifier of the current encryption key. Changes when the key rotates.
  bytes key_id = 2;

  // Raw public key bytes of the shared encryption key.
  //
  // For the X25519 scheme these are the 32 bytes produced by
  // [miden_protocol::crypto::dsa::eddsa_25519_sha512::PublicKey::to_bytes] (an Ed25519 public
  // key that miden-crypto converts internally for X25519 key agreement).
  bytes public_key = 3;

  reserved 4, 5;
  reserved "attestations", "next_key";
}

// The next transaction encryption key, announced ahead of a scheduled key rotation.
message NextTransactionEncryptionKey {
  // The key that replaces the current one at the activation block.
  TransactionEncryptionKey key = 1;

  // Block number at which the next key replaces the current one. Must be an epoch boundary.
  fixed32 activation_block_num = 2;
}

// Response to a transaction encryption key request: the current key and the key scheduled to
// replace it.
message TransactionEncryptionKeyResponse {
  // The encryption key currently in effect.
  TransactionEncryptionKey current_key = 1;

  // The key that replaces `current_key` at its activation block when a manual rotation has been
  // scheduled.
  optional NextTransactionEncryptionKey next_key = 2;

  // Epoch boundary at which the current key became active.
  fixed32 current_key_activation_block_num = 3;

  // Epoch in which this schedule was attested. A verifier must compare this with a trusted chain
  // tip so a schedule from an earlier epoch cannot be replayed.
  fixed32 attestation_epoch = 4;

  // Validator attestations over this complete schedule.
  //
  // Currently contains a single attestation from the validator that served the request.
  // Collecting attestations from the whole validator set requires validator intercommunication.
  repeated ValidatorKeyAttestation attestations = 5;
}

// Represents a transaction ID.
message TransactionId {
  // The transaction ID.
  primitives.Digest id = 1;
}

// Represents a transaction summary.
message TransactionSummary {
  // A unique 32-byte identifier of a transaction.
  TransactionId transaction_id = 1;

  // The block number in which the transaction was executed.
  fixed32 block_num = 2;

  // The ID of the account affected by the transaction.
  account.AccountId account_id = 3;
}

// Represents a commitment to an input note of a transaction.
//
// For authenticated notes, only the nullifier is present.
// For unauthenticated notes, the note header is also included.
message InputNoteCommitment {
  // The nullifier of the input note.
  primitives.Digest nullifier = 1;

  // The note header, present only for unauthenticated input notes.
  optional note.NoteHeader header = 2;
}

// Represents a transaction header.
message TransactionHeader {
  // The unique identifier of the transaction.
  TransactionId transaction_id = 1;

  // ID of the account against which the transaction was executed.
  account.AccountId account_id = 2;

  // State commitment of the account before the transaction was executed.
  primitives.Digest initial_state_commitment = 3;

  // State commitment of the account after the transaction was executed.
  primitives.Digest final_state_commitment = 4;

  // Input notes of the transaction.
  repeated InputNoteCommitment input_notes = 5;

  // Output notes of the transaction.
  repeated note.NoteHeader output_notes = 6;
}
